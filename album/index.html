<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>PHOTO ALBUM</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--card:#17171b;--line:#2b2b32;--txt:#f6f6f7;--mut:#9a9aa5;--accent:#f4f1ea;--header:#0b0b0d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#25252c 0,var(--bg) 42rem);color:var(--txt);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,select{font:inherit}.head{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:74px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;background:var(--header);backdrop-filter:blur(18px);border-bottom:1px solid #ffffff0d}.brand{text-align:center}.brand small{display:block;color:var(--mut);font-size:9px;letter-spacing:.22em}.brand h1{font-size:19px;margin:3px 0;letter-spacing:.08em}.ib{width:42px;height:42px;border:0;border-radius:50%;background:transparent;color:var(--txt);display:grid;place-items:center;text-decoration:none;cursor:pointer}.hidden{display:none!important}.wrap{width:min(1160px,100%);margin:auto;padding:20px 14px 80px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px;color:var(--mut);font-size:12px}.sel{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.albums{display:grid;grid-template-columns:1fr;gap:20px}.album{cursor:pointer}.cover{aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:var(--card);box-shadow:0 18px 50px #0005}.cover img{width:100%;height:100%;object-fit:cover;display:block}.meta{display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px;padding:11px 3px 0}.meta h2{margin:0;font-size:18px}.meta p,.count{margin:4px 0 0;color:var(--mut);font-size:11px}.siteIntro{padding:8px 2px 22px}.siteIntro .lead{font-size:clamp(20px,6vw,34px);font-weight:750;line-height:1.2;margin:0 0 8px}.siteIntro .intro{color:var(--mut);font-size:13px;line-height:1.7;margin:0;white-space:pre-line}.empty{padding:44px 20px;border:1px dashed var(--line);border-radius:20px;text-align:center;color:var(--mut)}.hero{padding:8px 2px 22px}.hero small{color:var(--mut);font-size:10px;letter-spacing:.2em}.hero h2{font-size:clamp(26px,8vw,46px);line-height:1.05;margin:5px 0 8px}.hero p{color:var(--mut);margin:0;white-space:pre-line}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}.tile{border:0;padding:0;aspect-ratio:1;background:var(--card);overflow:hidden;cursor:zoom-in}.tile img{width:100%;height:100%;object-fit:cover;display:block}.more{text-align:center;color:var(--mut);font-size:12px;padding:28px 0}.light{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#000}.light::backdrop{background:#000}.light figure{margin:0;width:100%;height:100%;display:grid;place-items:center;padding:60px 18px 74px}.light img{max-width:100%;max-height:100%;object-fit:contain}.x,.nav{position:fixed;z-index:3;border:0;color:#fff;background:#ffffff14;cursor:pointer}.x{top:max(14px,env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;font-size:28px}.nav{top:50%;transform:translateY(-50%);width:46px;height:70px;font-size:42px}.prev{left:0;border-radius:0 14px 14px 0}.next{right:0;border-radius:14px 0 0 14px}.pc{position:fixed;top:max(20px,env(safe-area-inset-top));left:18px;color:#aaa;font-size:12px}.cap{position:fixed;left:54px;right:54px;bottom:30px;text-align:center;color:#ddd;font-size:13px}.toast{position:fixed;z-index:99;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 28px);padding:12px 16px;border-radius:999px;background:var(--accent);color:#111;font-size:13px}
@media(min-width:680px){.albums{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(4,1fr)}}@media(min-width:980px){.albums{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header class="head"><button id="back" class="ib hidden" aria-label="戻る">←</button><div class="brand"><small id="eyebrow">PHOTO COLLECTION</small><h1 id="title">PHOTO ALBUM</h1></div><a class="ib" href="admin.html" aria-label="管理画面">•••</a></header>
<main class="wrap">
<section id="albumsView"><div class="siteIntro"><p id="headerText" class="lead">大切な思い出を写真で</p><p id="introText" class="intro"></p></div><div class="bar"><span id="albumCount">読み込み中...</span><select id="sort" class="sel"><option value="newest">新しい順</option><option value="oldest">古い順</option><option value="title">タイトル順</option></select></div><div id="albums" class="albums"></div></section>
<section id="gallery" class="hidden"><div id="hero" class="hero"></div><div id="photos" class="grid"></div><div id="more" class="more"></div></section>
</main>
<dialog id="light" class="light"><button id="close" class="x">×</button><button id="prev" class="nav prev">‹</button><figure><img id="big" alt=""></figure><button id="next" class="nav next">›</button><div id="pc" class="pc"></div><div id="cap" class="cap"></div></dialog>
<div id="toast" class="toast hidden"></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://esfgrykcvdctnvdqipbj.supabase.co','sb_publishable_Rwb3qaRXdWZoo05LrbFaDg_29tMI7uI');
const bucket='photo-album',pageSize=40;
const $=s=>document.querySelector(s),e={albumsView:$('#albumsView'),gallery:$('#gallery'),albums:$('#albums'),count:$('#albumCount'),sort:$('#sort'),back:$('#back'),title:$('#title'),eyebrow:$('#eyebrow'),headerText:$('#headerText'),introText:$('#introText'),hero:$('#hero'),photos:$('#photos'),more:$('#more'),light:$('#light'),big:$('#big'),cap:$('#cap'),pc:$('#pc'),close:$('#close'),prev:$('#prev'),next:$('#next'),toast:$('#toast')};
let site=null,albums=[],album=null,photos=[],page=0,more=true,loading=false,idx=-1;
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const url=p=>sb.storage.from(bucket).getPublicUrl(p).data.publicUrl;
const date=v=>{if(!v)return'';const d=new Date(v+'T00:00:00');return new Intl.DateTimeFormat('ja-JP').format(d)};
function toast(m){e.toast.textContent=m;e.toast.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.toast.classList.add('hidden'),3200)}
function applySite(){if(!site)return;const t=site.theme||{},r=document.documentElement.style;r.setProperty('--bg',t.background||'#0b0b0d');r.setProperty('--card',t.surface||'#17171b');r.setProperty('--txt',t.text||'#f6f6f7');r.setProperty('--mut',t.muted||'#9a9aa5');r.setProperty('--accent',t.accent||'#f4f1ea');r.setProperty('--header',t.header||t.background||'#0b0b0d');e.eyebrow.textContent=site.eyebrow_text||'PHOTO COLLECTION';e.title.textContent=site.page_title||'PHOTO ALBUM';e.headerText.textContent=site.header_text||'';e.introText.textContent=site.intro_text||'';e.headerText.classList.toggle('hidden',!site.header_text);e.introText.classList.toggle('hidden',!site.intro_text);document.title=site.page_title||'PHOTO ALBUM';document.querySelector('meta[name="theme-color"]').setAttribute('content',t.header||t.background||'#0b0b0d')}
async function loadSite(){const params=new URLSearchParams(location.search),slug=params.get('site');let q=sb.from('photo_album_sites_public').select('*');q=slug?q.eq('slug',slug):q.order('created_at',{ascending:true}).limit(1);const{data,error}=slug?await q.maybeSingle():await q.maybeSingle();if(error)return toast(error.message);site=data||null;if(site)applySite();await loadAlbums()}
async function loadAlbums(){let q=sb.from('photo_albums_public').select('*');if(site)q=q.eq('site_id',site.id);const{data,error}=await q;if(error)return toast(error.message);albums=(data||[]).map(a=>({...a,cover_url:a.cover_path?url(a.cover_path):''}));renderAlbums();const aq=new URLSearchParams(location.search).get('album');if(aq)openAlbum(aq,false)}
function renderAlbums(){const s=e.sort.value,l=[...albums].sort((a,b)=>s==='title'?a.title.localeCompare(b.title,'ja'):(s==='oldest'?String(a.album_date||a.created_at).localeCompare(String(b.album_date||b.created_at)):String(b.album_date||b.created_at).localeCompare(String(a.album_date||a.created_at))));e.count.textContent=l.length+' ALBUMS';e.albums.innerHTML=l.length?l.map(a=>`<article class="album" data-id="${esc(a.id)}" tabindex="0"><div class="cover">${a.cover_url?'<img loading="lazy" src="'+esc(a.cover_url)+'" alt="">':''}</div><div class="meta"><div><h2>${esc(a.title)}</h2><p>${date(a.album_date)}</p></div><span class="count">${Number(a.photo_count||0)} PHOTOS</span></div></article>`).join(''):'<div class="empty">公開中のアルバムはまだありません。</div>';e.albums.querySelectorAll('.album').forEach(x=>{const run=()=>openAlbum(x.dataset.id);x.onclick=run;x.onkeydown=v=>v.key==='Enter'&&run()})}
async function openAlbum(id,push=true){album=albums.find(a=>String(a.id)===String(id));if(!album)return;photos=[];page=0;more=true;e.albumsView.classList.add('hidden');e.gallery.classList.remove('hidden');e.back.classList.remove('hidden');e.title.textContent=album.title;e.hero.innerHTML='<small>'+esc(date(album.album_date)||'PHOTO ALBUM')+'</small><h2>'+esc(album.title)+'</h2>'+(album.description?'<p>'+esc(album.description)+'</p>':'');e.photos.innerHTML='';if(push){const qp=new URLSearchParams(location.search);qp.set('album',id);history.pushState({album:id},'',location.pathname+'?'+qp.toString())};await nextPage()}
async function nextPage(){if(!album||!more||loading)return;loading=true;e.more.textContent='読み込み中...';const from=page*pageSize,to=from+pageSize-1;const{data,error}=await sb.from('photo_album_photos').select('id,image_path,thumb_path,caption,position').eq('album_id',album.id).order('position',{ascending:true}).range(from,to);if(error){loading=false;return toast(error.message)}const batch=(data||[]).map(p=>({...p,image_url:url(p.image_path),thumb_url:url(p.thumb_path)})),base=photos.length;photos.push(...batch);batch.forEach((p,i)=>e.photos.insertAdjacentHTML('beforeend','<button class="tile" data-i="'+(base+i)+'"><img loading="lazy" src="'+esc(p.thumb_url)+'" alt=""></button>'));e.photos.querySelectorAll('.tile:not([data-b])').forEach(b=>{b.dataset.b='1';b.onclick=()=>show(Number(b.dataset.i))});page++;more=batch.length===pageSize;e.more.textContent=more?'スクロールしてさらに表示':photos.length+' PHOTOS';loading=false}
function back(){album=null;photos=[];e.gallery.classList.add('hidden');e.albumsView.classList.remove('hidden');e.back.classList.add('hidden');e.title.textContent=site?.page_title||'PHOTO ALBUM';const qp=new URLSearchParams(location.search);qp.delete('album');history.pushState({},'',location.pathname+(qp.toString()?'?'+qp.toString():''))}
function show(i){idx=i;paint();if(!e.light.open)e.light.showModal()}function paint(){const p=photos[idx];if(!p)return;e.big.src=p.image_url;e.cap.textContent=p.caption||'';e.pc.textContent=(idx+1)+' / '+photos.length;e.prev.disabled=idx<=0;e.next.disabled=idx>=photos.length-1&&!more}async function goNext(){if(idx<photos.length-1){idx++;paint()}else if(more){await nextPage();if(idx<photos.length-1){idx++;paint()}}}function goPrev(){if(idx>0){idx--;paint()}}
e.sort.onchange=renderAlbums;e.back.onclick=back;e.close.onclick=()=>e.light.close();e.next.onclick=goNext;e.prev.onclick=goPrev;new IntersectionObserver(v=>v[0]?.isIntersecting&&nextPage(),{rootMargin:'600px'}).observe(e.more);let tx=0;e.light.ontouchstart=v=>tx=v.changedTouches[0].clientX;e.light.ontouchend=v=>{const d=v.changedTouches[0].clientX-tx;if(Math.abs(d)>45)(d<0?goNext():goPrev())};addEventListener('popstate',()=>{const q=new URLSearchParams(location.search).get('album');q?openAlbum(q,false):(e.gallery.classList.contains('hidden')||back())});loadSite();
</script>
</body></html>
