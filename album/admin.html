<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>PHOTO ALBUM ADMIN</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--card:#17171b;--line:#2b2b32;--txt:#f6f6f7;--mut:#9a9aa5;--accent:#f4f1ea;--danger:#ff7474}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#25252c 0,var(--bg) 42rem);color:var(--txt);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button,input,textarea{font:inherit}.hidden{display:none!important}.head{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:70px 1fr 70px;align-items:center;min-height:74px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;background:#0b0b0dda;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff0d}.brand{text-align:center}.brand small{display:block;color:var(--mut);font-size:9px;letter-spacing:.22em}.brand h1{font-size:18px;margin:3px 0;letter-spacing:.08em}.link,.ghost{border:0;background:transparent;color:var(--txt);text-decoration:none;font-size:12px;cursor:pointer}.wrap{width:min(940px,100%);margin:auto;padding:22px 14px 80px}.card{background:#17171be8;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 50px #0005}.auth{max-width:520px;margin:8vh auto 0}.auth h2,.tool h2,.editor h2{margin:4px 0 8px}.mut{color:var(--mut);font-size:12px;line-height:1.6}.form{display:grid;gap:14px;margin-top:18px}.form label{display:grid;gap:7px;color:#c9c9cf;font-size:12px;font-weight:700}.form input,.form textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#111114;color:var(--txt);padding:13px 14px;outline:none}.form input:focus,.form textarea:focus{border-color:#686873}.primary,.danger,.upload{border:0;border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer}.primary,.upload{background:var(--accent);color:#111}.danger{background:#ff6b6b1f;color:#ff8d8d;border:1px solid #ff6b6b3d}.magic{border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:13px;padding:12px;cursor:pointer}.tool{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.quota{margin-bottom:16px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#17171bcc}.quotaTop{display:flex;justify-content:space-between;gap:12px;align-items:end}.quota strong{font-size:18px}.track,.progressTrack{height:8px;border-radius:99px;overflow:hidden;background:#2b2b32;margin-top:10px}.bar,.progressBar{height:100%;width:0;background:var(--accent)}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:64px 1fr 28px;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:16px;background:#151519;cursor:pointer}.thumb{width:64px;height:52px;border-radius:11px;overflow:hidden;background:#222}.thumb img{width:100%;height:100%;object-fit:cover}.row h3{margin:0;font-size:15px}.row p{margin:4px 0 0;color:var(--mut);font-size:11px}.empty{padding:35px 18px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--mut)}.editor{margin-top:22px}.editorHead{display:flex;justify-content:space-between;align-items:center}.gridForm{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px}.switch{display:flex!important;grid-auto-flow:column;justify-content:start;align-items:center;gap:10px}.switch input{width:auto}.actions{display:flex;gap:10px;flex-wrap:wrap}.uploadBox{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:20px;padding:16px;border:1px dashed #41414a;border-radius:16px}.upload input{display:none}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:16px}.photo{position:relative;aspect-ratio:1;background:#222;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;top:5px;right:5px;width:28px;height:28px;border:0;border-radius:50%;background:#000b;color:white;cursor:pointer}.toast{position:fixed;z-index:99;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 28px);padding:12px 16px;border-radius:999px;background:var(--accent);color:#111;font-size:13px}
@media(min-width:720px){.gridForm{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}.photos{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<header class="head"><a class="link" href="index.html">← 公開ページ</a><div class="brand"><small>OWNER ONLY</small><h1>ALBUM ADMIN</h1></div><button id="logout" class="ghost hidden">ログアウト</button></header>
<main class="wrap">
<section id="auth" class="card auth hidden"><h2>管理者ログイン</h2><p class="mut">既存のSupabase Authアカウントを使用します。</p><form id="login" class="form"><label>メールアドレス<input id="email" type="email" autocomplete="email" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">パスワードでログイン</button><button id="magic" class="magic" type="button">メールにログインリンクを送信</button></form></section>
<section id="admin" class="hidden"><div class="tool"><div><small class="mut">MANAGE</small><h2>アルバム管理</h2></div><button id="newAlbum" class="primary">＋ 新しいアルバム</button></div>
<div class="quota"><div class="quotaTop"><div><small class="mut">FREE PLAN GUARD</small><br><strong id="qCount">0 / 1500枚</strong></div><span id="qBytes" class="mut">推定 0 MB</span></div><div class="track"><div id="qBar" class="bar"></div></div><p class="mut">閲覧用最大400KB＋サムネイル最大50KB。元画像とEXIF/GPSは保存しません。</p></div>
<div id="albumList" class="list"></div>
<section id="editor" class="card editor hidden"><div class="editorHead"><div><small class="mut">EDIT ALBUM</small><h2 id="editorTitle">アルバム編集</h2></div><button id="closeEditor" class="ghost">×</button></div>
<form id="albumForm" class="form gridForm"><input id="albumId" type="hidden"><label>タイトル<input id="aTitle" maxlength="100" required></label><label>日付<input id="aDate" type="date"></label><label class="span2">説明<textarea id="aDesc" rows="3" maxlength="500"></textarea></label><label class="switch span2"><input id="aPub" type="checkbox" checked><span>公開ページに表示する</span></label><div class="actions span2"><button class="primary">保存</button><button id="deleteAlbum" class="danger hidden" type="button">アルバム削除</button></div></form>
<div id="uploadBox" class="uploadBox hidden"><div><strong>写真を追加</strong><p class="mut">複数選択可。端末内でWebPへ再生成してEXIFを削除します。</p></div><label class="upload">写真を選択<input id="files" type="file" accept="image/*" multiple></label></div>
<div id="progress" class="hidden"><div class="progressTrack"><div id="progressBar" class="progressBar"></div></div><p id="progressText" class="mut"></p></div><div id="photoGrid" class="photos"></div></section>
</section>
</main><div id="toast" class="toast hidden"></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://esfgrykcvdctnvdqipbj.supabase.co','sb_publishable_Rwb3qaRXdWZoo05LrbFaDg_29tMI7uI'),bucket='photo-album',maxPhotos=1500;
const $=s=>document.querySelector(s),e={auth:$('#auth'),admin:$('#admin'),logout:$('#logout'),login:$('#login'),email:$('#email'),pass:$('#password'),magic:$('#magic'),newAlbum:$('#newAlbum'),list:$('#albumList'),qCount:$('#qCount'),qBytes:$('#qBytes'),qBar:$('#qBar'),editor:$('#editor'),editorTitle:$('#editorTitle'),close:$('#closeEditor'),form:$('#albumForm'),id:$('#albumId'),title:$('#aTitle'),date:$('#aDate'),desc:$('#aDesc'),pub:$('#aPub'),del:$('#deleteAlbum'),upload:$('#uploadBox'),files:$('#files'),progress:$('#progress'),pBar:$('#progressBar'),pText:$('#progressText'),photos:$('#photoGrid'),toast:$('#toast')};
let user=null,albums=[],current=null,usage={count:0,bytes:0};
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),url=p=>sb.storage.from(bucket).getPublicUrl(p).data.publicUrl;
function toast(m){e.toast.textContent=m;e.toast.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.toast.classList.add('hidden'),3600)}
function bytes(n){return n<1048576?(n/1024).toFixed(n?1:0)+' KB':(n/1048576).toFixed(1)+' MB'}
async function init(){const{data:{session}}=await sb.auth.getSession();user=session?.user||null;renderAuth();sb.auth.onAuthStateChange((_x,s)=>{user=s?.user||null;renderAuth()})}
function renderAuth(){e.auth.classList.toggle('hidden',!!user);e.admin.classList.toggle('hidden',!user);e.logout.classList.toggle('hidden',!user);if(user)loadAlbums()}
async function loadAlbums(){const{data,error}=await sb.from('photo_albums').select('id,title,description,album_date,is_published,cover_path,created_at,photos:photo_album_photos(count)').order('album_date',{ascending:false,nullsFirst:false});if(error)return toast(error.message);albums=data||[];renderList();await loadUsage()}
function renderList(){e.list.innerHTML=albums.length?albums.map(a=>`<article class="row" data-id="${esc(a.id)}"><div class="thumb">${a.cover_path?'<img src="'+esc(url(a.cover_path))+'" alt="">':''}</div><div><h3>${esc(a.title)}</h3><p>${a.album_date||'日付なし'} · ${a.photos?.[0]?.count||0}枚 · ${a.is_published?'公開':'非公開'}</p></div><span>›</span></article>`).join(''):'<div class="empty">アルバムはまだありません。</div>';e.list.querySelectorAll('.row').forEach(x=>x.onclick=()=>edit(x.dataset.id))}
async function loadUsage(){const{data,error}=await sb.from('photo_album_photos').select('image_bytes,thumb_bytes').eq('owner_user_id',user.id);if(error)return toast(error.message);usage={count:(data||[]).length,bytes:(data||[]).reduce((s,p)=>s+(p.image_bytes||0)+(p.thumb_bytes||0),0)};e.qCount.textContent=usage.count+' / '+maxPhotos+'枚';e.qBytes.textContent='推定 '+bytes(usage.bytes)+' / 1 GB';e.qBar.style.width=Math.min(100,Math.round(usage.count/maxPhotos*100))+'%'}
function fresh(){current=null;e.form.reset();e.id.value='';e.pub.checked=true;e.del.classList.add('hidden');e.upload.classList.add('hidden');e.photos.innerHTML='';e.editorTitle.textContent='新しいアルバム';e.editor.classList.remove('hidden');e.editor.scrollIntoView({behavior:'smooth'})}
async function edit(id){current=albums.find(a=>String(a.id)===String(id));if(!current)return;e.id.value=current.id;e.title.value=current.title||'';e.date.value=current.album_date||'';e.desc.value=current.description||'';e.pub.checked=!!current.is_published;e.del.classList.remove('hidden');e.upload.classList.remove('hidden');e.editorTitle.textContent=current.title;e.editor.classList.remove('hidden');await loadPhotos();e.editor.scrollIntoView({behavior:'smooth'})}
async function save(ev){ev.preventDefault();const payload={title:e.title.value.trim(),description:e.desc.value.trim()||'',album_date:e.date.value||null,is_published:e.pub.checked,owner_user_id:user.id};let r;if(e.id.value)r=await sb.from('photo_albums').update(payload).eq('id',e.id.value).eq('owner_user_id',user.id).select().single();else r=await sb.from('photo_albums').insert(payload).select().single();if(r.error)return toast(r.error.message);toast('保存しました');await loadAlbums();await edit(r.data.id)}
async function loadPhotos(){if(!current)return;const{data,error}=await sb.from('photo_album_photos').select('*').eq('album_id',current.id).order('position',{ascending:true});if(error)return toast(error.message);e.photos.innerHTML=(data||[]).map(p=>`<div class="photo"><img src="${esc(url(p.thumb_path))}" alt=""><button data-id="${esc(p.id)}" data-i="${esc(p.image_path)}" data-t="${esc(p.thumb_path)}">×</button></div>`).join('');e.photos.querySelectorAll('button').forEach(b=>b.onclick=()=>removePhoto(b))}
async function removePhoto(b){if(!confirm('この写真を削除しますか？'))return;let r=await sb.storage.from(bucket).remove([b.dataset.i,b.dataset.t]);if(r.error)return toast(r.error.message);r=await sb.from('photo_album_photos').delete().eq('id',b.dataset.id).eq('owner_user_id',user.id);if(r.error)return toast(r.error.message);await refresh()}
async function removeAlbum(){if(!current||!confirm('アルバムと中の写真をすべて削除しますか？'))return;const{data,error}=await sb.from('photo_album_photos').select('image_path,thumb_path').eq('album_id',current.id);if(error)return toast(error.message);const paths=(data||[]).flatMap(p=>[p.image_path,p.thumb_path]);for(let i=0;i<paths.length;i+=100){const r=await sb.storage.from(bucket).remove(paths.slice(i,i+100));if(r.error)return toast(r.error.message)}const r=await sb.from('photo_albums').delete().eq('id',current.id).eq('owner_user_id',user.id);if(r.error)return toast(r.error.message);current=null;e.editor.classList.add('hidden');await loadAlbums();toast('削除しました')}
async function upload(files){if(!current)return;const list=[...files].filter(f=>f.type.startsWith('image/'));if(!list.length)return;await loadUsage();const remain=Math.max(0,maxPhotos-usage.count),use=list.slice(0,remain);if(!use.length)return toast('写真上限に達しています');e.files.disabled=true;e.progress.classList.remove('hidden');const{data:last}=await sb.from('photo_album_photos').select('position').eq('album_id',current.id).order('position',{ascending:false}).limit(1).maybeSingle();let pos=(last?.position??-1)+1,ok=0;for(let i=0;i<use.length;i++){progress(i,use.length,'圧縮中: '+use[i].name);try{await uploadOne(use[i],pos++);ok++}catch(err){console.error(err);toast(use[i].name+': '+err.message)}}progress(use.length,use.length,ok+'枚完了');e.files.value='';e.files.disabled=false;await refresh();setTimeout(()=>e.progress.classList.add('hidden'),1800)}
async function uploadOne(file,pos){let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch{bmp=await createImageBitmap(file)}try{const view=await encode(bmp,1800,720,.80,.44,400*1024),thumb=await encode(bmp,420,240,.68,.40,50*1024),key=crypto.randomUUID(),base=user.id+'/'+current.id,img=base+'/'+key+'.webp',th=base+'/thumbs/'+key+'.webp';let r=await sb.storage.from(bucket).upload(img,view,{contentType:'image/webp',cacheControl:'31536000'});if(r.error)throw r.error;r=await sb.storage.from(bucket).upload(th,thumb,{contentType:'image/webp',cacheControl:'31536000'});if(r.error){await sb.storage.from(bucket).remove([img]);throw r.error}r=await sb.from('photo_album_photos').insert({album_id:current.id,owner_user_id:user.id,image_path:img,thumb_path:th,position:pos,image_bytes:view.size,thumb_bytes:thumb.size});if(r.error){await sb.storage.from(bucket).remove([img,th]);throw r.error}}finally{bmp?.close?.()}}
async function encode(bmp,maxSide,minSide,q,minQ,target){const om=Math.max(bmp.width,bmp.height);let side=Math.min(maxSide,om),last=null;for(let a=0;a<16;a++){const ratio=Math.min(1,side/om),w=Math.max(1,Math.round(bmp.width*ratio)),h=Math.max(1,Math.round(bmp.height*ratio)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{alpha:false});x.fillStyle='#111';x.fillRect(0,0,w,h);x.imageSmoothingQuality='high';x.drawImage(bmp,0,0,w,h);last=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('画像変換失敗')),'image/webp',q));if(last.size<=target)return last;if(q>minQ+.03)q=Math.max(minQ,q-.07);else if(side>minSide){side=Math.max(minSide,Math.round(side*.84));q=.70}else break}throw new Error('容量まで圧縮できませんでした')}
async function refresh(){const{data:first}=await sb.from('photo_album_photos').select('thumb_path').eq('album_id',current.id).order('position',{ascending:true}).limit(1).maybeSingle();await sb.from('photo_albums').update({cover_path:first?.thumb_path||null}).eq('id',current.id).eq('owner_user_id',user.id);await loadAlbums();current=albums.find(a=>a.id===current.id)||current;await loadPhotos()}
function progress(done,total,label){e.pBar.style.width=(total?Math.round(done/total*100):0)+'%';e.pText.textContent=done+' / '+total+' · '+label}
e.login.onsubmit=async ev=>{ev.preventDefault();const{error}=await sb.auth.signInWithPassword({email:e.email.value,password:e.pass.value});if(error)toast(error.message)};e.magic.onclick=async()=>{const email=e.email.value.trim();if(!email)return toast('メールアドレスを入力してください');const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href,shouldCreateUser:false}});toast(error?error.message:'ログインリンクを送信しました')};e.logout.onclick=()=>sb.auth.signOut();e.newAlbum.onclick=fresh;e.close.onclick=()=>e.editor.classList.add('hidden');e.form.onsubmit=save;e.del.onclick=removeAlbum;e.files.onchange=v=>upload(v.target.files);init();
</script>
</body></html>
