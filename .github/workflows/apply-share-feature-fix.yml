name: Apply Battle Memo share feature fix

on:
  push:
    paths:
      - ".github/workflows/apply-share-feature-fix.yml"

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply share feature
        shell: bash
        run: |
          if grep -q 'id="shareBtn"' index.html; then exit 0; fi
          python - <<'PY'
          from pathlib import Path
          w = Path('.github/workflows/apply-share-feature.yml').read_text(encoding='utf-8')
          marker = "cat > /tmp/p.gz.b64 <<'PATCH'\n"
          chunk = w.split(marker, 1)[1].split('\n          PATCH\n', 1)[0]
          Path('/tmp/p.gz.b64').write_text(''.join(line.strip() for line in chunk.splitlines()), encoding='utf-8')
          PY
          base64 -d /tmp/p.gz.b64 | gzip -d > /tmp/p.patch
          git apply --reject /tmp/p.patch || true
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          if 'shareBtn: document.getElementById("shareBtn")' not in t:
              old = '      exportTransferBtn: document.getElementById("exportTransferBtn"),\n      exportTransferStatus: document.getElementById("exportTransferStatus")\n'
              new = '      exportTransferBtn: document.getElementById("exportTransferBtn"),\n      exportTransferStatus: document.getElementById("exportTransferStatus"),\n      shareBtn: document.getElementById("shareBtn"),\n      shareModal: document.getElementById("shareModal"),\n      shareClose: document.getElementById("shareClose"),\n      shareFrameName: document.getElementById("shareFrameName"),\n      shareText: document.getElementById("shareText"),\n      copyShareTextBtn: document.getElementById("copyShareTextBtn"),\n      nativeShareBtn: document.getElementById("nativeShareBtn"),\n      generateShareImageBtn: document.getElementById("generateShareImageBtn"),\n      shareImagePreview: document.getElementById("shareImagePreview"),\n      shareImageActions: document.getElementById("shareImageActions"),\n      downloadShareImageBtn: document.getElementById("downloadShareImageBtn"),\n      shareImageBtn: document.getElementById("shareImageBtn"),\n      shareStatus: document.getElementById("shareStatus")\n'
              if old not in t:
                  raise SystemExit('element-map anchor not found')
              t = t.replace(old, new, 1)
          if 'let activeShareTemplate = "oshi";' not in t:
              old = '    let activeRemainingItemKey = null;\n'
              new = '    let activeRemainingItemKey = null;\n    let activeShareTemplate = "oshi";\n    let generatedShareBlob = null;\n    let generatedShareObjectUrl = "";\n'
              if old not in t:
                  raise SystemExit('state anchor not found')
              t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY
          rm -f index.html.rej
          grep -q 'id="shareBtn"' index.html
          grep -q 'function buildShareText' index.html
          grep -q 'shareBtn: document.getElementById("shareBtn")' index.html
          grep -q 'let activeShareTemplate = "oshi";' index.html
          python - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(encoding='utf-8')
          a = t.rfind('<script>'); b = t.find('</script>', a)
          assert a >= 0 and b >= 0
          Path('/tmp/app.js').write_text(t[a+8:b], encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit updated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "ChatGPT GitHub updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add Battle Memo sharing tools"
          git push origin HEAD:main
