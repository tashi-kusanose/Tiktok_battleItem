name: Apply live glove comment copy patch

on:
  push:
    paths:
      - '.github/workflows/apply-live-glove-copy.yml'
      - '.github/apply_live_glove_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python .github/apply_live_glove_patch.py
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add live glove attendance comment copy"
          git push
