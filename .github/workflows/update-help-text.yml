name: Update free usage guide

on:
  push:
    paths:
      - '.github/workflows/update-help-text.yml'
      - '.github/patch_help_text.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update usage guide
        run: python .github/patch_help_text.py
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update free version usage guide"
          git push
