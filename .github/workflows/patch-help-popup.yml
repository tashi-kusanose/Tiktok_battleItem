name: Patch popup usage guide

on:
  push:
    paths:
      - '.github/workflows/patch-help-popup.yml'
      - '.github/patch_help_popup.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update usage guide UI
        run: python .github/patch_help_popup.py
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Change usage guide to title popup UI"
          git push
