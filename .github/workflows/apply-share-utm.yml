name: Apply share UTM attribution patch

on:
  push:
    paths:
      - '.github/workflows/apply-share-utm.yml'

permissions:
  contents: write

jobs:
  patch-share-url:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch share URL attribution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''    function getShareUrl() {
              return `${location.origin}${location.pathname}`;
            }'''
          old_normal = '''    function getShareUrl() {
      return `${location.origin}${location.pathname}`;
    }'''
          new = '''    function getShareUrl() {
      const url = new URL(`${location.origin}${location.pathname}`);
      url.searchParams.set("utm_source", "user_share");
      url.searchParams.set("utm_medium", "share");
      url.searchParams.set("utm_campaign", "battle_item_manager");
      return url.toString();
    }'''

          if 'utm_source", "user_share' in text:
              print('UTM attribution is already present; no change needed.')
              raise SystemExit(0)

          target = old_normal if old_normal in text else old
          if target not in text:
              raise SystemExit('Target getShareUrl() implementation was not found; refusing to modify the file.')

          text = text.replace(target, new, 1)
          path.write_text(text, encoding='utf-8')
          print('Patched getShareUrl() successfully.')
          PY

      - name: Commit patch if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add UTM attribution to shared links"
          git push
