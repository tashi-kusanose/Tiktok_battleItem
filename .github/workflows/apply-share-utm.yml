name: Apply share UTM attribution patch

on:
  push:
    paths:
      - '.github/workflows/apply-share-utm.yml'

permissions:
  contents: write

jobs:
  patch-share-url:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch share URL attribution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = "    function getShareUrl() {\n      return `${location.origin}${location.pathname}`;\n    }"
          new = "    function getShareUrl() {\n      const url = new URL(`${location.origin}${location.pathname}`);\n      url.searchParams.set(\"utm_source\", \"user_share\");\n      url.searchParams.set(\"utm_medium\", \"share\");\n      url.searchParams.set(\"utm_campaign\", \"battle_item_manager\");\n      return url.toString();\n    }"

          if 'utm_source\", \"user_share' in text:
              print('UTM attribution is already present; no change needed.')
              raise SystemExit(0)

          if old not in text:
              raise SystemExit('Target getShareUrl() implementation was not found; refusing to modify the file.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Patched getShareUrl() successfully.')
          PY

      - name: Commit patch if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add UTM attribution to shared links"
          git push
