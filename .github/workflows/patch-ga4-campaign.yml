name: Patch GA4 campaign tags

on:
  push:
    paths:
      - '.github/workflows/patch-ga4-campaign.yml'
      - '.github/patch_ga4_campaign.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update share UTM tags
        run: python .github/patch_ga4_campaign.py
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Align referral UTM tags for live glove campaign"
          git push
