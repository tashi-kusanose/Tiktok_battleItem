name: Fix live glove layout

on:
  push:
    paths:
      - '.github/workflows/fix-live-glove-layout.yml'
      - '.github/fix_live_glove_layout.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix person row columns
        run: python .github/fix_live_glove_layout.py
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix live glove person row layout"
          git push
