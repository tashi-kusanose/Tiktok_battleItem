<body>
  <main aria-label="イベントを選ぶ">
    <h1 class="sr-only">KazzCompany イベント一覧</h1>

    <a class="banner masters" data-event="masters-october-2026" href="masters/" aria-label="MASTERS CHAMPIONSHIP 第6回10月大会のイベントページを開く">
      <div class="banner-art masters-art" aria-hidden="true">
        <svg viewBox="375 1138 282 311" preserveAspectRatio="xMidYMid meet" focusable="false">
          <image href="assets/masters.png" width="723" height="1536"/>
        </svg>
      </div>
      <div class="banner-copy">
        <p class="eyebrow">2026 <span class="separator">/</span> 第6回 10月大会</p>

      <span class="open-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" focusable="false"><path d="M5 12h13M12 5l7 7-7 7"/></svg></span>

    <a class="banner community" data-event="community-boost-2026" href="community-boost/" aria-label="COMMUNITY BOOST 10月イベントのページを開く">
      <div class="banner-art community-art" aria-hidden="true">
        <svg viewBox="0 397 541 141" preserveAspectRatio="xMidYMid slice" focusable="false">
          <image href="assets/community.png" width="541" height="1536"/>

      </div>
      <div class="banner-copy">
        <p class="eyebrow">2026 <span class="separator">/</span> OCTOBER EVENT</p>
        <h2 class="community-title"><span>COMMUNITY</span><strong>BOOST</strong></h2>
        <p class="caption">コミュニティと、次のステージへ。</p>
      </div>
      <span class="open-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" focusable="false"><path d="M5 12h13M12 5l7 7-7 7"/></svg></span>
    </a>

    <a class="banner king" data-event="king-of-stage-2026" href="king-of-stage/" aria-label="THE KING OF STAGEのイベントページを開く">
      <div class="banner-art king-art" aria-hidden="true">
        <svg viewBox="327 276 747 433" preserveAspectRatio="xMidYMid meet" focusable="false">
          <image href="assets/king.png" width="1400" height="1536"/>
        </svg>
      </div>
      <div class="banner-copy">
        <p class="eyebrow">LEGENDS <span class="cross">×</span> BREAKERS</p>

      <div class="banner-copy">
        <p class="eyebrow">2026 <span class="separator">/</span> 10.19 — 10.25</p>
        <h2 class="music-title"><span>MUSIC</span><span>STAGE</span></h2>

      <span class="open-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" focusable="false"><path d="M5 12h13M12 5l7 7-7 7"/></svg></span>
